[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narrow-nav"
version = "0.1.0"
description = "Core contracts and configuration for NarrowNav Research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["hydra-core>=1.3.2,<1.4", "omegaconf>=2.3,<2.4"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.11,<1"]
sim = ["mujoco>=4.0"]
human-models = [
    "jupedsim==1.4.2",
]
human-orca = ["pyrvo2==0.0.0"]
human-jupedsim = ["jupedsim==1.4.2"]
human-all = ["jupedsim==1.4.2", "pyrvo2==0.0.0"]

[project.scripts]
narrow-nav-config = "narrow_nav.simulation.configuration:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# Match the Python-RVO2 gitlink. Its legacy setup.py reports version 0.0.0.
pyrvo2 = { git = "https://github.com/sybrenstuvel/Python-RVO2.git", rev = "c2c46ba8d59556aa10faf03479293236efea154d" }

[tool.uv.extra-build-dependencies]
pyrvo2 = ["Cython==3.1.4", "setuptools==80.9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep globally installed plugins out of the repository's test environment.
addopts = ["--disable-plugin-autoload"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["experiments/social_navigation/vendor"]

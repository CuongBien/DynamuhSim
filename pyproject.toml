[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamuhsim"
version = "0.1.0"
description = "Shared runtime for DynamuhSim experiments"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["python"]

[project.optional-dependencies]
perception = ["numpy"]

[tool.setuptools.package-data]
"dynamuhsim.runtime" = ["gl_probe.cpp", "native/*.cc"]
"dynamuhsim.datasets" = ["normalization_contract.json"]

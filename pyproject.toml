[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narrow-nav"
version = "0.1.0"
description = "Core contracts and configuration for NarrowNav Research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["hydra-core>=1.3.2,<1.4", "omegaconf>=2.3,<2.4"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.11,<1"]
sim = ["mujoco>=4.0"]
human-models = [
    "jupedsim==1.4.2",
]

[project.scripts]
narrow-nav-config = "narrow_nav.simulation.configuration:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep globally installed plugins out of the repository's test environment.
addopts = ["--disable-plugin-autoload"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["experiments/social_navigation/vendor"]

amcl:
  ros__parameters:
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    base_frame_id: base_footprint
    global_frame_id: map
    initial_pose:
      x: -13.0
      y: 0.0
      yaw: 0.0
      z: 0.0
    laser_max_range: 3.5
    laser_min_range: 0.12
    laser_model_type: likelihood_field
    map_topic: /map
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    robot_model_type: nav2_amcl::OmniMotionModel
    scan_topic: /scan
    set_initial_pose: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    use_sim_time: true
behavior_server:
  ros__parameters:
    backup:
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - wait
    enable_stamped_cmd_vel: true
    global_frame: map
    odom_topic: /odom
    robot_base_frame: base_footprint
    spin:
      plugin: nav2_behaviors::Spin
    use_sim_time: true
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    use_sim_time: true
controller_server:
  ros__parameters:
    FollowPath:
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
      CostCritic:
        collision_cost: 2000000.0
        consider_footprint: false
        cost_power: 1
        cost_weight: 16.0
        critical_cost: 300.0
        enabled: true
        near_collision_cost: 140
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        threshold_to_consider: 0.5
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        threshold_to_consider: 2.5
      PathAlignCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        max_path_occupancy_ratio: 0.15
        offset_from_furthest: 30
        threshold_to_consider: 0.5
        trajectory_point_step: 3
        use_path_orientations: false
      PathAngleCritic:
        cost_power: 1
        cost_weight: 1.0
        enabled: true
        max_angle_to_furthest: 1.0
        mode: 0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
      PathFollowCritic:
        cost_power: 1
        cost_weight: 6.0
        enabled: true
        offset_from_furthest: 25
        threshold_to_consider: 2.5
      PreferForwardCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
        threshold_to_consider: 0.5
      ax_max: 1.5
      ax_min: -1.5
      ay_max: 1.0
      ay_min: -1.0
      az_max: 3.0
      batch_size: 150
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - PathAlignCritic
      - PathFollowCritic
      gamma: 0.015
      iteration_count: 1
      model_dt: 0.05
      motion_model: Omni
      plugin: nav2_mppi_controller::MPPIController
      prune_distance: 3.0
      regenerate_noises: true
      temperature: 0.3
      time_steps: 30
      transform_tolerance: 0.2
      visualize: false
      vx_max: 0.6
      vx_min: -0.2
      vx_std: 0.2
      vy_max: 0.4
      vy_std: 0.15
      wz_max: 1.8
      wz_std: 0.3
    controller_frequency: 50.0
    controller_plugins:
    - FollowPath
    costmap_update_timeout: 0.3
    enable_stamped_cmd_vel: true
    failure_tolerance: 0.5
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.25
    goal_checker_plugins:
    - goal_checker
    progress_checker:
      movement_time_allowance: 15.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
    progress_checker_plugins:
    - progress_checker
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 5.0
        inflation_radius: 0.35
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 3.5
          raytrace_max_range: 3.5
          topic: /scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_footprint
      robot_radius: 0.16
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      update_frequency: 2.0
      use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      global_frame: odom
      height: 3
      inflation_layer:
        cost_scaling_factor: 5.0
        inflation_radius: 0.35
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 3.5
          raytrace_max_range: 3.5
          topic: /scan
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 5.0
      resolution: 0.05
      robot_base_frame: base_footprint
      robot_radius: 0.16
      rolling_window: true
      update_frequency: 10.0
      use_sim_time: true
      width: 3
map_server:
  ros__parameters:
    use_sim_time: true
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
    expected_planner_frequency: 10.0
    planner_plugins:
    - GridBased
    use_sim_time: true
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    use_sim_time: true
    wait_at_waypoint:
      enabled: false
      waypoint_pause_duration: 0
    waypoint_task_executor_bt:
      plugin: nav2_waypoint_follower::WaitAtWaypoint

amcl:
  ros__parameters:
    use_sim_time: True

    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1

    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"

    transform_tolerance: 1.0
    update_min_d: 0.05
    update_min_a: 0.05

    laser_model_type: "likelihood_field"
    laser_max_range: 3.5
    laser_min_range: 0.12
    max_beams: 60

    max_particles: 2000
    min_particles: 500

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    scan_topic: /scan
    map_topic: /map

    set_initial_pose: true

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      min_vel_x: 0.0
      max_vel_x: 0.20
      min_vel_y: 0.0
      max_vel_y: 0.0

      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0

      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.0

      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05

      sim_time: 1.0
      vx_samples: 10
      vtheta_samples: 20

      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      stateful: true
      enable_stamped_cmd_vel: true


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True

      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      robot_base_frame: base_footprint

      rolling_window: true

      width: 3
      height: 3
      resolution: 0.05

      robot_radius: 0.105

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_max_range: 3.5
          raytrace_max_range: 3.5

          max_obstacle_height: 2.0
          min_obstacle_height: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.20
        cost_scaling_factor: 5.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True

      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_footprint

      resolution: 0.05

      track_unknown_space: true

      robot_radius: 0.105

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_max_range: 3.5
          raytrace_max_range: 3.5

          max_obstacle_height: 2.0
          min_obstacle_height: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.20
        cost_scaling_factor: 5.0

      always_send_full_costmap: true

bt_navigator:
  ros__parameters:
    use_sim_time: True

    global_frame: map
    robot_base_frame: base_footprint

    transform_tolerance: 0.5

    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"

behavior_server:
  ros__parameters:
    use_sim_time: True

    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom

    behavior_plugins:
      - spin
      - backup
      - wait

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    wait:
      plugin: "nav2_behaviors::Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: True

    loop_rate: 20

    stop_on_failure: false

    waypoint_task_executor_bt:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"

    wait_at_waypoint:
      enabled: false
      waypoint_pause_duration: 0

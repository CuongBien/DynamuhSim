    student_head_on_A:
      id: 1
      group_id: -1
      skin: 0
      max_vel: 1.20
      radius: 0.28
      goal_radius: 0.35
      cyclic_goals: true
      init_pose: {x: -12.000, y: -8.050, z: 0.000, h: 0.0}
      behavior:
        type: Regular
        configuration: 0
        goal_force_factor: 2.0
        obstacle_force_factor: 10.0
        social_force_factor: 5.0
        other_force_factor: 20.0
      goals: [1, 2]

    student_opposite_A:
